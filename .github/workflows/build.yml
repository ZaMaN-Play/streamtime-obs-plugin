name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-ci-x64 --config RelWithDebInfo

      - name: Install into package folder
        run: cmake --install build_x64 --config RelWithDebInfo --prefix release/RelWithDebInfo

      - name: Zip installer
        run: Compress-Archive -Path release/RelWithDebInfo/* -DestinationPath streamtime-windows-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: streamtime-windows-x64
          path: streamtime-windows-x64.zip
