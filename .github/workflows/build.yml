name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        shell: pwsh
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin (installer zip)
        shell: pwsh
        run: ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: streamtime-windows-x64
          path: release/*.zip
