name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-ci-x64 --config RelWithDebInfo

      - name: Install into package folder
        run: cmake --install build_x64 --config RelWithDebInfo --prefix release/RelWithDebInfo

      - name: Build Setup.exe
        run: iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StreamTime-Setup
          path: output/StreamTime-Setup.exe
